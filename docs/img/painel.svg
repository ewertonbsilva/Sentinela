<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-label="Ilustração do painel Sentinela com dados fictícios: indicadores, gráfico de alertas por hora, proporção por cenário e reincidentes">
  <style>
    text { font-family: Segoe UI, system-ui, Arial, sans-serif; fill: #0a1c2e; }
    .t { font-size: 15px; font-weight: 700; }
    .s { font-size: 12px; fill: #5b6b7c; }
    .k { font-size: 30px; font-weight: 700; fill: #0f2a43; }
    .cartao { fill: #fff; stroke: #d5e0ea; stroke-width: 1.5; }
  </style>
  <rect width="1100" height="640" fill="#f1f5f9"/>
  <rect width="1100" height="56" fill="#0f2a43"/>
  <rect y="54" width="1100" height="3" fill="#2f80ed"/>
  <circle cx="34" cy="28" r="16" fill="#0a1c2e" stroke="#2f80ed" stroke-width="2"/>
  <path d="M22 28 Q34 17 46 28 Q34 39 22 28 Z" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="62" y="26" font-size="17" font-weight="700" style="fill:#fff">Sentinela</text>
  <text x="62" y="43" font-size="11" style="fill:#c9dcef">Defesa da rede · CrowdSec</text>
  <text x="900" y="34" font-size="13" style="fill:#fff">Período: 24 horas</text>
  <g font-size="13"><text x="30" y="84" font-weight="700" style="fill:#2f80ed">Visão geral</text><text x="130" y="84" fill="#5b6b7c">Alertas</text><text x="200" y="84" fill="#5b6b7c">Bloqueios</text><text x="285" y="84" fill="#5b6b7c">Consultar IP</text><text x="385" y="84" fill="#5b6b7c">Cenários</text></g>
  <line x1="24" y1="92" x2="1076" y2="92" stroke="#d5e0ea"/>

  <g>
    <rect class="cartao" x="24" y="106" width="196" height="84" rx="10"/><text class="k" x="42" y="150">14</text><text class="s" x="42" y="172">Bloqueios ativos</text>
    <rect class="cartao" x="234" y="106" width="196" height="84" rx="10"/><text class="k" x="252" y="150">209</text><text class="s" x="252" y="168">Alertas no período</text><text class="s" x="252" y="182" style="fill:#2e7d4f">−6% vs. período anterior</text>
    <rect class="cartao" x="444" y="106" width="196" height="84" rx="10"/><text class="k" x="462" y="150">40</text><text class="s" x="462" y="168">IPs distintos</text><text class="s" x="462" y="182">0% vs. período anterior</text>
    <rect class="cartao" x="654" y="106" width="196" height="84" rx="10"/><text class="k" x="672" y="150">8</text><text class="s" x="672" y="172">Países</text>
    <rect class="cartao" x="864" y="106" width="212" height="84" rx="10"/><text class="k" x="882" y="150">42.185</text><text class="s" x="882" y="172">Eventos suspeitos</text>
  </g>
  <rect x="24" y="202" width="1052" height="30" rx="8" fill="#e3edf8"/>
  <text class="s" x="40" y="222">Sem picos fora do normal. Último alerta: há 14 min.</text>

  <rect class="cartao" x="24" y="246" width="700" height="200" rx="10"/>
  <text class="t" x="42" y="272">Alertas por hora</text>
  <g fill="#1f6fd0">
    <rect x="50" y="340" width="18" height="86"/><rect x="76" y="318" width="18" height="108"/><rect x="102" y="352" width="18" height="74"/><rect x="128" y="332" width="18" height="94"/><rect x="154" y="360" width="18" height="66"/><rect x="180" y="300" width="18" height="126"/><rect x="206" y="336" width="18" height="90"/><rect x="232" y="322" width="18" height="104"/><rect x="258" y="348" width="18" height="78"/><rect x="284" y="310" width="18" height="116"/><rect x="310" y="342" width="18" height="84"/><rect x="336" y="326" width="18" height="100"/><rect x="362" y="352" width="18" height="74"/><rect x="388" y="296" width="18" height="130"/><rect x="414" y="334" width="18" height="92"/><rect x="440" y="344" width="18" height="82"/><rect x="466" y="318" width="18" height="108"/><rect x="492" y="356" width="18" height="70"/><rect x="518" y="330" width="18" height="96"/><rect x="544" y="306" width="18" height="120"/><rect x="570" y="346" width="18" height="80"/><rect x="596" y="338" width="18" height="88"/><rect x="622" y="316" width="18" height="110"/><rect x="648" y="396" width="18" height="30"/>
  </g>
  <line x1="42" y1="426" x2="708" y2="426" stroke="#d5e0ea"/>

  <rect class="cartao" x="738" y="246" width="338" height="200" rx="10"/>
  <text class="t" x="756" y="272">Alertas por cenário</text>
  <g transform="translate(830 360)" fill="none" stroke-width="22">
    <circle r="46" stroke="#0f2a43" stroke-dasharray="87 202" transform="rotate(-90)"/>
    <circle r="46" stroke="#1f6fd0" stroke-dasharray="75 214" stroke-dashoffset="-87" transform="rotate(-90)"/>
    <circle r="46" stroke="#2f80ed" stroke-dasharray="55 234" stroke-dashoffset="-162" transform="rotate(-90)"/>
    <circle r="46" stroke="#8ecae6" stroke-dasharray="72 217" stroke-dashoffset="-217" transform="rotate(-90)"/>
  </g>
  <text x="830" y="366" text-anchor="middle" font-size="18" font-weight="700">209</text>
  <g font-size="12"><rect x="920" y="318" width="10" height="10" fill="#0f2a43"/><text x="936" y="327">http-probing  30%</text><rect x="920" y="340" width="10" height="10" fill="#1f6fd0"/><text x="936" y="349">local/http-404-flood  26%</text><rect x="920" y="362" width="10" height="10" fill="#2f80ed"/><text x="936" y="371">http-crawl  19%</text><rect x="920" y="384" width="10" height="10" fill="#8ecae6"/><text x="936" y="393">outros  25%</text></g>

  <rect class="cartao" x="24" y="460" width="1052" height="164" rx="10"/>
  <text class="t" x="42" y="486">Reincidentes <tspan class="s" font-weight="400">(IPs com 2 ou mais alertas no período)</tspan></text>
  <g font-size="12">
    <text x="42" y="512" font-weight="700">IP</text><text x="240" y="512" font-weight="700">País</text><text x="320" y="512" font-weight="700">Alertas</text><text x="420" y="512" font-weight="700">Cenários</text><text x="800" y="512" font-weight="700">Bloqueio</text>
    <line x1="36" y1="520" x2="1064" y2="520" stroke="#d5e0ea"/>
    <text x="42" y="542">203.0.113.17</text><text x="240" y="542">DE</text><text x="320" y="542">10</text><text x="420" y="542">local/http-404-flood, http-probing</text><text x="800" y="542">em vigor</text>
    <text x="42" y="568">198.51.100.84</text><text x="240" y="568">BR</text><text x="320" y="568">9</text><text x="420" y="568">http-crawl-non_statics, http-probing</text><text x="800" y="568">em vigor</text>
    <text x="42" y="594">192.0.2.203</text><text x="240" y="594">US</text><text x="320" y="594">8</text><text x="420" y="594">http-sensitive-files</text><text x="800" y="594">expirado</text>
  </g>
</svg>
